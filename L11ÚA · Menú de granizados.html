<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LÚA · Menú de granizados</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F9F6EF;--navy:#0B3A5C;--green:#739A4E;--sun:#F9C32B;--sky:#3EB0E8;--ink:#0B3A5C;--card:#fff;--shadow:rgba(11,58,92,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#10222e;--navy:#F3EEDF;--ink:#F3EEDF;--card:#173141;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--cream:#10222e;--navy:#F3EEDF;--ink:#F3EEDF;--card:#173141;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;z-index:0;pointer-events:none}
.b1{top:-90px;left:-90px;width:220px;height:220px;background:var(--sun);border-radius:50% 40% 60% 30%}
.b2{top:-60px;right:-70px;width:180px;height:180px;background:var(--sky);border-radius:40% 60% 50% 50%}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px 60px}
header{text-align:center}
.logo{display:inline-block;background:var(--green);color:#fff;font-family:'Libre Baskerville',serif;font-weight:700;font-size:44px;padding:14px 56px 18px;border-radius:50% 50% 46% 54%/60% 60% 40% 40%;letter-spacing:2px}
h1{font-family:'Libre Baskerville',serif;font-size:clamp(34px,6vw,52px);margin:18px 0 6px}
.tag{display:inline-block;background:var(--sun);color:#0B3A5C;font-family:'Libre Baskerville',serif;font-weight:700;padding:8px 26px;border-radius:30px 18px 34px 18px;font-size:20px}
.hint{margin:14px 0 0;font-size:14px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 22px;margin-top:34px;list-style:none;padding:0}
.item{text-align:center}
.pic{all:unset;cursor:pointer;display:block;width:100%;aspect-ratio:3/3.8;border-radius:999px;overflow:hidden;background:#eee;box-shadow:0 8px 20px var(--shadow);transition:transform .25s,box-shadow .25s;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic:hover,.pic:focus-visible{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px var(--shadow)}
.pic:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
.pic .plus{position:absolute;right:14%;bottom:7%;width:38px;height:38px;border-radius:50%;background:var(--sun);color:#0B3A5C;font:700 22px/38px Montserrat;text-align:center}
.name{font-family:'Libre Baskerville',serif;font-weight:700;font-size:18px;margin:14px 0 0}
.from{font-size:13px;opacity:.75;margin-top:2px}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;overflow:auto}
dialog::backdrop{background:rgba(11,58,92,.6);backdrop-filter:blur(3px)}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{position:relative;background:var(--card);color:var(--ink);border-radius:28px;max-width:720px;width:100%;display:grid;grid-template-columns:260px 1fr;gap:28px;padding:30px;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.big{width:100%;aspect-ratio:3/3.8;border-radius:999px;overflow:hidden;box-shadow:0 8px 22px var(--shadow)}
.big img{width:100%;height:100%;object-fit:cover}
.info h2{font-family:'Libre Baskerville',serif;font-size:30px;margin:4px 0 14px}
.info h3{font-size:14px;margin:18px 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{background:var(--sun);color:#0B3A5C;font-weight:600;font-size:13px;padding:6px 12px;border-radius:10px}
.sizes{display:flex;gap:10px}
.sizes button{flex:1;cursor:pointer;font:600 15px Montserrat;color:var(--ink);background:transparent;border:2px solid var(--green);border-radius:16px;padding:10px 6px}
.sizes button[aria-pressed="true"]{background:var(--green);color:#fff}
.sizes button:focus-visible,.nav button:focus-visible,.x:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.price{font-family:'Libre Baskerville',serif;font-size:36px;font-weight:700;margin:14px 0 0}
.nav{display:flex;gap:10px;margin-top:20px}
.nav button{cursor:pointer;font:600 14px Montserrat;background:var(--sky);color:#0B3A5C;border:0;border-radius:14px;padding:10px 16px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--navy);color:var(--cream);font-size:20px;cursor:pointer}
@media (max-width:640px){.sheet{grid-template-columns:1fr;padding:22px;gap:18px}.big{max-width:210px;margin:0 auto}.grid{grid-template-columns:repeat(2,1fr);gap:28px 14px}.logo{font-size:36px;padding:12px 40px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
<header>
<div class="logo">LÚA</div>
<h1>Menú</h1>
<span class="tag">Granizados</span>
<p class="hint">Toca la foto de un granizado para ver sus ingredientes y precios.</p>
</header>
<ul class="grid" id="grid"></ul>
</main>
<dialog id="dlg" aria-label="Detalle del granizado">
<div class="wrap" id="wrap"><div class="sheet">
<button class="x" id="close" aria-label="Cerrar">✕</button>
<div class="big"><img id="bimg" alt=""></div>
<div class="info">
<h2 id="dname"></h2>
<h3>Ingredientes</h3><ul class="chips" id="ing"></ul>
<h3>Tamaño</h3>
<div class="sizes"><button data-s="12" aria-pressed="true">12 oz</button><button data-s="16" aria-pressed="false">16 oz</button></div>
<div class="price" id="price"></div>
<div class="nav"><button id="prev">Anterior</button><button id="next">Siguiente</button></div>
</div></div></div>
</dialog>

const fmt=n=>'$'+n.toLocaleString('es-CO');
const grid=document.getElementById('grid'),dlg=document.getElementById('dlg');
let cur=0,size=12;
D.forEach((p,i)=>{
 const li=document.createElement('li');li.className='item';
 li.innerHTML=`<button class="pic" aria-label="Ver detalles de ${p.n}"><img src="${p.img}" alt="Granizado ${p.n}"><span class="plus" aria-hidden="true">+</span></button><p class="name">${p.n}</p><div class="from">desde ${fmt(p.p12)}</div>`;
 li.querySelector('button').onclick=()=>{cur=i;size=12;render();dlg.showModal()};
 grid.appendChild(li);
});
function render(){
 const p=D[cur];
 document.getElementById('bimg').src=p.img;document.getElementById('bimg').alt=p.n;
 document.getElementById('dname').textContent=p.n;
 document.getElementById('ing').innerHTML=p.ing.map(x=>`<li>${x}</li>`).join('');
 document.querySelectorAll('.sizes button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===size)));
 document.getElementById('price').textContent=fmt(size===12?p.p12:p.p16);
}
document.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{size=+b.dataset.s;render()});
const go=d=>{cur=(cur+d+D.length)%D.length;render()};
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('close').onclick=()=>dlg.close();
document.getElementById('wrap').addEventListener('click',e=>{if(e.target.id==='wrap')dlg.close()});
dlg.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
